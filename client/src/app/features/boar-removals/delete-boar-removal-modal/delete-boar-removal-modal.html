<app-modal [open]="open()" size="sm" title="Eliminar baja" (closed)="closed.emit()">
  <div class="space-y-4">
    <p class="text-sm text-muted-foreground">
      ¿Seguro que quieres eliminar la baja del verraco
      <span class="font-medium text-foreground">{{ boarCode() ?? 'sin identificar' }}</span>
      @if (removal(); as current) {
        del {{ current.removal_date }}?
      }
    </p>
    <p class="text-sm text-muted-foreground">
      El verraco volverá a su estado anterior y quedará activo nuevamente.
    </p>

    <div class="flex justify-end gap-2 pt-2">
      <button
        type="button"
        (click)="closed.emit()"
        class="rounded-md border border-border px-4 py-2 text-sm font-medium transition hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirm()"
        [disabled]="loading()"
        class="rounded-md bg-danger px-4 py-2 text-sm font-medium text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      >
        {{ loading() ? 'Eliminando…' : 'Eliminar' }}
      </button>
    </div>
  </div>
</app-modal>

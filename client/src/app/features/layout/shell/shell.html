<div class="min-h-screen bg-background">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/50 lg:hidden" (click)="closeSidebar()"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex h-screen w-64 flex-col overflow-hidden border-r border-border bg-card transition-transform lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex h-16 shrink-0 items-center border-b border-border px-5">
      <span class="text-base font-semibold tracking-tight">Pigs</span>
    </div>

    <nav class="flex-1 min-h-0 space-y-1 overflow-y-auto p-3">
      @if (isAdmin()) {
        @for (group of adminGroups(); track group.label) {
          <div class="space-y-1">
            <button
              type="button"
              (click)="toggleGroup(group.label)"
              [attr.aria-expanded]="isGroupExpanded(group.label)"
              class="flex w-full items-center justify-between rounded-md px-3 py-2 text-sm font-medium text-foreground transition hover:bg-muted"
            >
              <span>{{ group.label }}</span>
              <span class="text-muted-foreground">{{ isGroupExpanded(group.label) ? '−' : '+' }}</span>
            </button>

            @if (isGroupExpanded(group.label)) {
              <div class="ml-2 space-y-1">
                @for (item of group.items; track item.route) {
                  <a
                    [routerLink]="item.route"
                    [routerLinkActiveOptions]="{ exact: item.route === homeLink() }"
                    routerLinkActive="bg-muted font-medium text-foreground"
                    (click)="closeSidebar()"
                    class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
                  >
                    <span>{{ item.label }}</span>
                  </a>
                }
              </div>
            }
          </div>
        }
      } @else {
        <a
          routerLink="/home"
          routerLinkActive="bg-muted font-medium text-foreground"
          (click)="closeSidebar()"
          class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
        >
          <span>Inicio</span>
        </a>

        <a
          routerLink="/reports"
          routerLinkActive="bg-muted font-medium text-foreground"
          (click)="closeSidebar()"
          class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
        >
          <span>Reportes</span>
        </a>

        <a
          routerLink="/sow-history"
          routerLinkActive="bg-muted font-medium text-foreground"
          (click)="closeSidebar()"
          class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
        >
          <span>Historial de cerdas</span>
        </a>
      }
    </nav>

    <div class="shrink-0 border-t border-border p-3">
      <div class="mb-2 px-3">
        <p class="truncate text-sm font-medium">{{ user()?.username }}</p>
        <p class="text-xs text-muted-foreground">{{ user()?.role }}</p>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="block w-full rounded-md px-3 py-2 text-left text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-border bg-background/80 px-4 backdrop-blur"
    >
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-border text-foreground transition hover:bg-muted lg:hidden"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="ml-auto">
        <app-theme-toggle />
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8">
      <router-outlet />
    </main>
  </div>
</div>

<div class="min-h-screen bg-background">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/50 lg:hidden" (click)="closeSidebar()"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-border bg-card transition-transform lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex h-16 items-center border-b border-border px-5">
      <span class="text-base font-semibold tracking-tight">Pigs</span>
    </div>

    <nav class="flex-1 space-y-1 p-3">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Panel</span>
      </a>

      <a
        routerLink="/breeds"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Razas</span>
      </a>

      <a
        routerLink="/boars"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Verracos</span>
      </a>

      <a
        routerLink="/boar-removals"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Remover verracos</span>
      </a>

      <a
        routerLink="/sows"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Cerdas</span>
      </a>

      <a
        routerLink="/services"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Servicios</span>
      </a>

      <a
        routerLink="/abortions"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Abortos</span>
      </a>

      <a
        routerLink="/farrowings"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Partos</span>
      </a>

      <a
        routerLink="/piglet-deaths"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Muertes de lechones</span>
      </a>

      <a
        routerLink="/piglet-fosterings"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Traslados de lechones</span>
      </a>

      <a
        routerLink="/partial-weagings"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Destetes parciales</span>
      </a>

      <a
        routerLink="/weagings"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Destetes</span>
      </a>

      <a
        routerLink="/sow-removals"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Remover cerdas</span>
      </a>

      <a
        routerLink="/medications"
        routerLinkActive="bg-muted font-medium text-foreground"
        (click)="closeSidebar()"
        class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Medicamentos</span>
      </a>

      @if (isAdmin()) {
        <a
          routerLink="/operators"
          routerLinkActive="bg-muted font-medium text-foreground"
          (click)="closeSidebar()"
          class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
        >
          <span>Operadores</span>
        </a>

        <a
          routerLink="/users"
          routerLinkActive="bg-muted font-medium text-foreground"
          (click)="closeSidebar()"
          class="block rounded-md px-3 py-2 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
        >
          <span>Usuarios</span>
        </a>
      }
    </nav>

    <div class="border-t border-border p-3">
      <div class="mb-2 px-3">
        <p class="truncate text-sm font-medium">{{ user()?.username }}</p>
        <p class="text-xs text-muted-foreground">{{ user()?.role }}</p>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="block w-full rounded-md px-3 py-2 text-left text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground"
      >
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-border bg-background/80 px-4 backdrop-blur"
    >
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-border text-foreground transition hover:bg-muted lg:hidden"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-4 w-4"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="ml-auto">
        <app-theme-toggle />
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8">
      <router-outlet />
    </main>
  </div>
</div>

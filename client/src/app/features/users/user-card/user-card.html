<article class="rounded-xl border border-border bg-card p-4">
  <div class="flex items-start justify-between gap-3">
    <h2 class="truncate font-medium">{{ user().name }}</h2>
    <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="roleClass()">
      {{ roleLabel() }}
    </span>
  </div>

  <p class="mt-1 truncate text-sm text-muted-foreground">&#64;{{ user().username }}</p>

  <div class="mt-3 flex items-center justify-between gap-3">
    <p class="text-xs text-muted-foreground">
      Creado el {{ user().created_at | date: 'dd/MM/yyyy' }}
    </p>

    <button
      type="button"
      (click)="editRequested.emit(user())"
      class="inline-flex items-center gap-1.5 rounded-md border border-border px-2.5 py-1 text-xs font-medium transition hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-3.5 w-3.5"
      >
        <path
          d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
        />
      </svg>
      Editar
    </button>
  </div>
</article>

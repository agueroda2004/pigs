<article class="rounded-xl border border-border bg-card p-4">
  <div class="flex items-start justify-between gap-3">
    <h2 class="truncate font-medium">{{ boar().code }}</h2>
    <div class="flex shrink-0 items-center gap-2">
      <span class="rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="originClass()">
        {{ originLabel() }}
      </span>
      <span class="rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="stateClass()">
        {{ stateLabel() }}
      </span>
    </div>
  </div>

  <div class="mt-2 space-y-1 text-sm text-muted-foreground">
    <p class="truncate">Raza: {{ breedName() ?? 'Sin raza' }}</p>
    <p class="truncate">Ubicación: {{ boar().location ?? 'Sin ubicación' }}</p>
  </div>

  <div class="mt-3 flex items-center justify-between gap-3">
    <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="activeClass()">
      {{ activeLabel() }}
    </span>

    @if (canEdit()) {
      <button
        type="button"
        (click)="editRequested.emit(boar())"
        class="inline-flex items-center gap-1.5 rounded-md border border-border px-2.5 py-1 text-xs font-medium transition hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-3.5 w-3.5"
        >
          <path
            d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
          />
        </svg>
        Editar
      </button>
    }
  </div>
</article>

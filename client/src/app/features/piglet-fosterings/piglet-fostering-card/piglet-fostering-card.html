<article class="rounded-xl border border-border bg-card p-4">
  <div class="flex items-start justify-between gap-3">
    <h2 class="truncate font-medium">
      {{ donorSowCode() ?? 'sin identificar' }} → {{ receiverSowCode() ?? 'sin identificar' }}
    </h2>
    <span class="shrink-0 rounded-full bg-muted px-2.5 py-0.5 text-xs font-medium">Traslado</span>
  </div>

  <div class="mt-2 space-y-1 text-sm text-muted-foreground">
    <p class="truncate">Fecha: {{ fostering().movement_date }}</p>
    <p class="truncate">Cantidad: {{ fostering().quantity }}</p>
    @if (fostering().note) {
      <p class="truncate">Nota: {{ fostering().note }}</p>
    }
  </div>

  @if (canEdit()) {
    <div class="mt-3 flex justify-end border-t border-border pt-3">
      <button
        type="button"
        (click)="editRequested.emit(fostering())"
        class="inline-flex items-center gap-1.5 rounded-md border border-border px-2.5 py-1 text-xs font-medium transition hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-3.5 w-3.5"
        >
          <path
            d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
          />
        </svg>
        Editar
      </button>
    </div>
  }
</article>

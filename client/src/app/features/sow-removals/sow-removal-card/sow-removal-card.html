<article class="rounded-xl border border-border bg-card p-4">
  <div class="flex items-start justify-between gap-3">
    <h2 class="truncate font-medium">Cerda {{ sowCode() ?? 'sin identificar' }}</h2>
    <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="typeClass()">
      {{ typeLabel() }}
    </span>
  </div>

  <div class="mt-2 space-y-1 text-sm text-muted-foreground">
    <p class="truncate">Fecha: {{ removal().removal_date }}</p>
    <p class="truncate">Motivo: {{ reasonLabel() }}</p>
    <p class="truncate">Estado anterior: {{ lastStateLabel() }}</p>
    @if (removal().note) {
      <p class="truncate">Nota: {{ removal().note }}</p>
    }
  </div>
</article>

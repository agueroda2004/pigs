<article class="rounded-xl border border-border bg-card p-4">
  <div class="flex items-start justify-between gap-3">
    <h2 class="truncate font-medium">Cerda {{ sowCode() ?? 'sin identificar' }}</h2>
    <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="causeClass()">
      {{ causeLabel() }}
    </span>
  </div>

  <div class="mt-2 space-y-1 text-sm text-muted-foreground">
    <p class="truncate">Fecha: {{ abortion().abortion_date }}</p>
    @if (abortion().note) {
      <p class="truncate">Nota: {{ abortion().note }}</p>
    }
  </div>
</article>

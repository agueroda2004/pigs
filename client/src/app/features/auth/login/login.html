<div class="flex min-h-screen items-center justify-center bg-background px-4">
  <div class="w-full max-w-sm rounded-xl border border-border bg-card p-8 shadow-sm">
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">Iniciar sesión</h1>
      <app-theme-toggle />
    </div>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="space-y-1.5">
        <label for="username" class="block text-sm font-medium">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm outline-none transition focus:border-foreground focus:ring-2 focus:ring-ring"
        />
      </div>

      <div class="space-y-1.5">
        <label for="password" class="block text-sm font-medium">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm outline-none transition focus:border-foreground focus:ring-2 focus:ring-ring"
        />
      </div>

      @if (error()) {
        <p class="text-sm text-danger">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
